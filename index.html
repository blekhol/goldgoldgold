<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxwin Kaszinó</title>
</head>

<body>
    <nav class="navbar navbar-expand-sm bg-light ">
        <div class="container-fluid">
            <a href="index.html" class="navbar-brand">Placeholder</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mynavbar">
                <button class="btn btn-primary me-2" id="login">Belépés</button>
                <button class="btn btn-primary" id="signup">Regisztráció</button>
            </div>
        </div>
    </nav>
    <div class="container">

        <br>
        <!--BEFIZETÉS-->
        <button type="button" class="btn btn-primary" data-bs-toggle="modal"
            data-bs-target="#BefizetesModal">Befizetés</button>

        <div class="modal" id="BefizetesModal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4 class="modal-title">Pénz befizetése</h4>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        Minimum feltöltés összege: 5.000 Ft
                        <!--OPCIÓK-->
                        <div class="form-check">
                            <input type="radio" class="form-check-input" id="radio1" name="optradio" value="option1" checked>
                            <label class="form-check-label" for="radio1">5.000 Ft</label>
                        </div>
                        <div class="form-check">
                            <input type="radio" class="form-check-input" id="radio2" name="optradio" value="option2">
                            <label class="form-check-label" for="radio2">7.500 Ft</label>
                        </div>
                        <div class="form-check">
                            <input type="radio" class="form-check-input" id="radio3" name="optradio" value="option3">
                            <label class="form-check-label" for="radio3">10.000 Ft</label>
                        </div>
                        <div class="form-check">
                            <input type="radio" class="form-check-input" id="radio4" name="optradio" value="option4">
                            <label class="form-check-label" for="radio4">15.000 Ft</label>
                        </div>
                        <div class="form-check">
                            <input type="radio" class="form-check-input" id="radio5" name="optradio" value="option5">
                            <label class="form-check-label" for="radio5">20.000 Ft</label>
                        </div>
                        <div class="form-check">
                            <input type="radio" class="form-check-input" id="radio6" name="optradio" value="option6">
                            <label class="form-check-label" for="radio6">50.000 Ft</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button id="BefizetesBtn" type="button" class="btn btn-success" data-bs-dismiss="modal">Fizetés</button>
                    </div>

                </div>
            </div>
        </div>
        <script src="./src/main.ts" type="module"></script>

    </div>
    <script src="./src/main.ts" type="module"></script>
</body>

</html>
